version: '3.8'

services:
  mock-api:
    build:
      context: ./mock-api
      dockerfile: Dockerfile
    container_name: invoice-mock-api
    ports:
      - "8080:8080"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invoice-backend
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file:
      - ./backend/.env
    environment:
      - PORT=${PORT:-3001}
      - MOCK_API_URL=http://mock-api:8080
      - MOCK_API_KEY=${MOCK_API_KEY:-demo-key-1234}
    depends_on:
      - mock-api
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: invoice-frontend
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - ./frontend/.env
    environment:
      - PORT=${PORT:-3000}
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - backend
    restart: unless-stopped
